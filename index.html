<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyward Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1626; user-select: none; }
  #game, #hud, #vignette { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #vignette {
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(16, 10, 18, 0) 54%, rgba(18, 10, 16, 0.34) 100%);
  }
  #hud { pointer-events: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #rotate-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    align-items: center;
    justify-content: center;
    background: rgba(10, 14, 24, 0.82);
    backdrop-filter: blur(6px);
    pointer-events: none;
    padding: 24px;
    text-align: center;
  }
  #rotate-card {
    background: rgba(18, 26, 42, 0.92);
    border: 1.5px solid rgba(255, 190, 85, 0.55);
    border-radius: 14px;
    padding: 20px 26px;
    color: #f4f1ea;
    font: 700 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.04em;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    #rotate-overlay { display: flex; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Skyward Run: 3D golden-hour flight challenge"></canvas>
<div id="vignette" aria-hidden="true"></div>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="rotate-overlay" aria-live="polite">
  <div id="rotate-card">请横屏游玩 · ROTATE DEVICE FOR BEST EXPERIENCE</div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
